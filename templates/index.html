```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Score Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 40px #0004;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            padding: 12px;
            color: #b91c1c;
            background: #fee2e2;
            border-radius: 8px;
            text-align: center;
        }

        .note {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Credit Score Prediction</h1>

        <p class="subtitle">
            Machine Learning Based Prediction System
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/">
            <label for="income">Annual Income (₹)</label>
            <input
                type="number"
                id="income"
                name="income"
                min="0"
                step="any"
                required
            >

            <label for="debt">Outstanding Debt (₹)</label>
            <input
                type="number"
                id="debt"
                name="debt"
                min="0"
                step="any"
                required
            >

            <label for="payment">Number of Late Payments</label>
            <input
                type="number"
                id="payment"
                name="payment"
                min="0"
                step="1"
                required
            >

            <label for="utilization">Credit Utilization (%)</label>
            <input
                type="number"
                id="utilization"
                name="utilization"
                min="0"
                max="100"
                step="any"
                required
            >

            <button type="submit">Predict Credit Score</button>
        </form>
        
{% if prediction is not none %}
    <div class="result">
        <h2>Credit Score Prediction</h2>
        <p>{{ prediction }}</p>
    </div>
{% endif %}


        <p class="note">
            AIML Mini Project<br>
            Educational demonstration only.
        </p>
    </main>
</body>
</html>
